<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Francês - Prática Oral</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e1e1e; border-radius: 16px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .counter { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .phrase-pt { font-size: 1.3rem; font-weight: bold; color: #ffcc00; border-bottom: 1px solid #333; padding-bottom: 12px; }
        .phrase-fr { font-size: 1.5rem; font-weight: bold; color: #ffffff; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button { background-color: #2b2b2b; color: white; border: 2px solid #444; padding: 12px 20px; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        button:active { background-color: #3b3b3b; }
        #btn-mic { background-color: #0056b3; border-color: #007bff; }
        #feedback { font-size: 1.1rem; font-weight: bold; min-height: 30px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="counter" id="counter">Frase 1 / 100</div>
        <div class="phrase-pt" id="phrase-pt">Carregando frase...</div>
        <div class="phrase-fr" id="phrase-fr">...</div>
        
        <div class="controls">
            <button onclick="ouvirAudio()">🔊 Ouvir Frase</button>
            <button id="btn-mic" onclick="falarFrase()">🎤 Falar Pronúncia</button>
            <button onclick="proximaFrase()">Próxima ➡️</button>
        </div>
        <div id="feedback"></div>
    </div>

    <script>
        const frases = [
            { pt: "Bom dia, como você está?", fr: "Bonjour, comment ça va ?" },
            { pt: "Eu gostaria de um café, por favor.", fr: "Je voudrais un café, s'il vous plaît." },
            { pt: "Muito obrigado pela ajuda.", fr: "Merci beaucoup pour votre aide." },
            { pt: "Onde fica a estação de metrô?", fr: "Où se trouve la station de métro ?" },
            { pt: "Eu não entendo francês muito bem.", fr: "Je ne comprends pas très bien le français." },
            { pt: "Você pode falar mais devagar?", fr: "Pouvez-vous parler plus lentement ?" },
            { pt: "Quanto custa este item?", fr: "Combien ça coûte ?" },
            { pt: "Eu sou do Brasil.", fr: "Je viens du Brésil." },
            { pt: "Prazer em conhecê-lo.", fr: "Enchanté de faire votre connaissance." },
            { pt: "Até logo, tenha um bom dia!", fr: "À bientôt, passez une bonne journée !" },
            { pt: "Onde fica o banheiro?", fr: "Où sont les toilettes ?" },
            { pt: "Eu preciso de ajuda.", fr: "J'ai besoin d'aide." },
            { pt: "Desculpe pelo incômodo.", fr: "Désolé pour le dérangement." },
            { pt: "Sim, por favor.", fr: "Oui, s'il vous plaît." },
            { pt: "Não, obrigado.", fr: "Non, merci." },
            { pt: "Eu não sei.", fr: "Je ne sais pas." },
            { pt: "Você fala inglês?", fr: "Parlez-vous anglais ?" },
            { pt: "Eu estou aprendendo francês.", fr: "J'apprends le français." },
            { pt: "O tempo está ótimo hoje.", fr: "Il fait très beau aujourd'hui." },
            { pt: "Está chovendo muito.", fr: "Il pleut beaucoup." },
            { pt: "Qual é o seu nome?", fr: "Comment vous appelez-vous ?" },
            { pt: "Meu nome é...", fr: "Je m'appelle..." },
            { pt: "Onde você mora?", fr: "Où habitez-vous ?" },
            { pt: "Eu moro em Curitiba.", fr: "J'habite à Curitiba." },
            { pt: "O que você faz da vida?", fr: "Que faites-vous dans la vie ?" },
            { pt: "Eu sou motorista.", fr: "Je suis chauffeur." },
            { pt: "Eu trabalho com máquinas pesadas.", fr: "Je travaille avec des machines lourdes." },
            { pt: "Tenho uma família maravilhosa.", fr: "J'ai une famille merveilleuse." },
            { pt: "Nós vamos nos mudar em breve.", fr: "Nous allons bientôt déménager." },
            { pt: "Eu gosto de jogar videogame.", fr: " j'aime jouer aux jeux vidéo." },
            { pt: "Qual é a hora?", fr: "Quelle heure est-il ?" },
            { pt: "São duas horas.", fr: "Il est deux heures." },
            { pt: "Eu estou com fome.", fr: "J'ai faim." },
            { pt: "Eu estou com sede.", fr: "J'ai soif." },
            { pt: "A comida está deliciosa.", fr: "La nourriture est délicieuse." },
            { pt: "A conta, por favor.", fr: "L'addition, s'il vous plaît." },
            { pt: "Aceita cartão de crédito?", fr: "Acceptez-vous les cartes de crédit ?" },
            { pt: "Onde posso comprar um bilhete?", fr: "Où puis-je acheter un billet ?" },
            { pt: "O trem está atrasado.", fr: "Le train est en retard." },
            { pt: "Onde fica o hotel?", fr: "Où se trouve l'hôtel ?" },
            { pt: "Eu reservei um quarto.", fr: "J'ai réservé une chambre." },
            { pt: "O Wi-Fi é gratuito?", fr: "Le Wi-Fi est-il gratuit ?" },
            { pt: "Qual é a senha?", fr: "Quel est le mot de passe ?" },
            { pt: "Minha bateria acabou.", fr: "Ma batterie est vide." },
            { pt: "Você pode repetir?", fr: "Pouvez-vous répéter ?" },
            { pt: "Eu entendi.", fr: "J'ai compris." },
            { pt: "Eu não entendi nada.", fr: "Je n'ai rien compris." },
            { pt: "Como se diz isso em francês?", fr: "Comment dit-on cela en français ?" },
            { pt: "Tenha um bom dia!", fr: "Bonne journée !" },
            { pt: "Boa Noite!", fr: "Bonne nuit !" },
            { pt: "Até logo!", fr: "À plus tard !" },
            { pt: "Até amanhã!", fr: "À demain !" },
            { pt: "Com licença.", fr: "Excusez-moi." },
            { pt: "Com licença (passagem).", fr: "Pardon." },
            { pt: "Tudo bem?", fr: "Ça va ?" },
            { pt: "Tudo bem, e com você?", fr: "Ça va bien, et vous ?" },
            { pt: "Mais ou menos.", fr: "Comme ci, comme ça." },
            { pt: "Até mais!", fr: "Salut !" },
            { pt: "Bem-vindo!", fr: "Bienvenue !" },
            { pt: "Parabéns!", fr: "Félicitations !" },
            { pt: "Boa sorte!", fr: "Bonne chance !" },
            { pt: "Cuidado!", fr: "Attention !" },
            { pt: "Pare!", fr: "Arrêtez !" },
            { pt: "Venha aqui.", fr: "Venez ici." },
            { pt: "Espere um momento.", fr: "Attendez un moment." },
            { pt: "Vamos lá!", fr: "Allons-y !" },
            { pt: "Estou pronto.", fr: "Je suis prêt." },
            { pt: "Está certo.", fr: "C'est bon." },
            { pt: "Está errado.", fr: "C'est faux." },
            { pt: "Perfeito!", fr: "Parfait !" },
            { pt: "Excelente!", fr: "Excellent !" },
            { pt: "Obrigado pelo seu tempo.", fr: "Merci pour votre temps." },
            { pt: "Tenha uma boa viagem.", fr: "Bon voyage." },
            { pt: "Até a próxima.", fr: "Jusqu'à la prochaine." },
            { pt: "Eu amo estudar idiomas.", fr: "J'adore étudier les langues." },
            { pt: "A prática leva à perfeição.", fr: "C'est en forging qu'on devient forgeron." },
            { pt: "A vida é bela.", fr: "La vie est belle." },
            { pt: "Nunca desista.", fr: "N'abandonnez jamais." },
            { pt: "Tente outra vez.", fr: "Essayez encore." },
            { pt: "Eu acredito em mim.", fr: "Je crois en moi." },
            { pt: "O sucesso exige esforço.", fr: "Le succès demande des efforts." },
            { pt: "O trabalho duro compensa.", fr: "Le travail acharné paie." },
            { pt: "Eu foco no meu objetivo.", fr: "Je me concentre sur mon objectif." },
            { pt: "Cada dia é um novo aprendizado.", fr: "Chaque jour est un nouvel apprentissage." },
            { pt: "Eu consigo fazer isso.", fr: "Je peux le faire." },
            { pt: "Estou progredindo rápido.", fr: "Je progresse rapidement." },
            { pt: "Minha memória está melhorando.", fr: "Ma mémoire s'améliore." },
            { pt: "Aprender francês é divertido.", fr: "Apprendre le français est amusant." },
            { pt: "Eu domino a pronúncia.", fr: "Je maîtrise la prononciation." },
            { pt: "Pratico todos os dias.", fr: "Je pratique tous les jours." },
            { pt: "Ouço e repito.", fr: "J'écoute et je répète." },
            { pt: "Meu vocabulário está crescendo.", fr: "Mon vocabulaire s'agrandit." },
            { pt: "Estou construindo meu futuro.", fr: "Je construis mon avenir." },
            { pt: "Grandes mudanças estão chegando.", fr: "De grands changements arrivent." },
            { pt: "Eu estou preparado para o desafio.", fr: "Je suis prêt pour le défi." },
            { pt: "A jornada é longa mas vale a pena.", fr: "Le voyage est long mais ça vaut le coup." },
            { pt: "Sou forte e determinado.", fr: "Je suis fort et déterminé." },
            { pt: "Obrigado por tudo.", fr: "Merci pour tout." },
            { pt: "Até logo, meu amigo.", fr: "À bientôt, mon ami." },
            { pt: "Até a vitória!", fr: "Vers la victoire !" }
        ];

        let atual = 0;

        function atualizarTela() {
            document.getElementById("counter").innerText = `Frase ${atual + 1} / ${frases.length}`;
            document.getElementById("phrase-pt").innerText = frases[atual].pt;
            document.getElementById("phrase-fr").innerText = frases[atual].fr;
            document.getElementById("feedback").innerText = "";
        }

        function ouvirAudio() {
            const texto = new SpeechSynthesisUtterance(frases[atual].fr);
            texto.lang = "fr-FR";
            window.speechSynthesis.speak(texto);
        }

        function falarFrase() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = "fr-FR";
            document.getElementById("feedback").innerText = "Ouvindo... Fale agora!";
            
            recognition.onresult = function(event) {
                const dito = event.results[0][0].transcript.toLowerCase().trim();
                const esperado = frases[atual].fr.toLowerCase().replace(/[^a-zà-ÿ]/g, "");
                const ditoLimpo = dito.replace(/[^a-zà-ÿ]/g, "");
                
                if (ditoLimpo.includes(esperado) || esperado.includes(ditoLimpo)) {
                    document.getElementById("feedback").innerHTML = "✅ <span style='color: #28a745;'>Correto! Perfeito!</span>";
                } else {
                    document.getElementById("feedback").innerHTML = `❌ <span style='color: #dc3545;'>Você disse: "${dito}". Tente novamente!</span>`;
                }
            };
            recognition.onerror = function() {
                document.getElementById("feedback").innerText = "Não reconheci o áudio. Tente de novo.";
            };
            recognition.start();
        }

        function proximaFrase() {
            atual = (atual + 1) % frases.length;
            atualizarTela();
        }

        atualizarTela();
    </script>
</body>
</html>
