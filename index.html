<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Francês - Prática Oral</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e1e1e; border-radius: 16px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .counter { font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .phrase-pt { font-size: 1.3rem; font-weight: bold; color: #ffcc00; border-bottom: 1px solid #333; padding-bottom: 12px; }
        .phrase-fr { font-size: 1.5rem; font-weight: bold; color: #ffffff; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button { background-color: #2b2b2b; color: white; border: 2px solid #444; padding: 12px 20px; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        button:active { background-color: #3b3b3b; }
        #btn-mic { background-color: #0056b3; border-color: #007bff; }
        #feedback { font-size: 1.1rem; font-weight: bold; min-height: 30px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="counter" id="counter">Frase 1 / 100</div>
        <div class="phrase-pt" id="phrase-pt">Carregando frase...</div>
        <div class="phrase-fr" id="phrase-fr">...</div>
        
        <div class="controls">
            <button onclick="ouvirAudio()">🔊 Ouvir Frase</button>
            <button id="btn-mic" onclick="falarFrase()">🎤 Falar Pronúncia</button>
            <button onclick="proximaFrase()">Próxima ➡️</button>
        </div>
        <div id="feedback"></div>
    </div>

    <script>
        const frases = [
            { pt: "Bom dia, como você está?", fr: "Bonjour, comment ça va ?" },
            { pt: "Eu gostaria de um café, por favor.", fr: "Je voudrais un café, s'il vous plaît." },
            { pt: "Muito obrigado pela ajuda.", fr: "Merci beaucoup pour votre aide." },
            { pt: "Onde fica a estação de metrô?", fr: "Où se trouve la station de métro ?" }
        ];

        let atual = 0;

        function atualizarTela() {
            document.getElementById("counter").innerText = `Frase ${atual + 1} / ${frases.length}`;
            document.getElementById("phrase-pt").innerText = frases[atual].pt;
            document.getElementById("phrase-fr").innerText = frases[atual].fr;
            document.getElementById("feedback").innerText = "";
        }

        function ouvirAudio() {
            const texto = new SpeechSynthesisUtterance(frases[atual].fr);
            texto.lang = "fr-FR";
            window.speechSynthesis.speak(texto);
        }

        function falarFrase() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = "fr-FR";
            document.getElementById("feedback").innerText = "Ouvindo... Fale agora!";
            
            recognition.onresult = function(event) {
                const dito = event.results[0][0].transcript.toLowerCase().trim();
                const esperado = frases[atual].fr.toLowerCase().replace(/[^a-zà-ÿ]/g, "");
                const ditoLimpo = dito.replace(/[^a-zà-ÿ]/g, "");
                
                if (ditoLimpo.includes(esperado) || esperado.includes(ditoLimpo)) {
                    document.getElementById("feedback").innerHTML = "✅ <span style='color: #28a745;'>Correto! Perfeito!</span>";
                } else {
                    document.getElementById("feedback").innerHTML = `❌ <span style='color: #dc3545;'>Você disse: "${dito}". Tente novamente!</span>`;
                }
            };
            recognition.onerror = function() {
                document.getElementById("feedback").innerText = "Não reconheci o áudio. Tente de novo.";
            };
            recognition.start();
        }

        function proximaFrase() {
            atual = (atual + 1) % frases.length;
            atualizarTela();
        }

        atualizarTela();
    </script>
</body>
</html>
